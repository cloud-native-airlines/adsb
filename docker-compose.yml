services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adsb
      POSTGRES_USER: adsb
      POSTGRES_PASSWORD: adsb
    ports:
      - "5432:5432"
    volumes:
      - adsb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adsb -d adsb"]
      interval: 3s
      timeout: 3s
      retries: 20

  adsb:
    build: .
    environment:
      DATABASE_URL: postgres://adsb:adsb@postgres:5432/adsb?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  adsb-postgres:
