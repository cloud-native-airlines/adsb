name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: adsb-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: adsb
          POSTGRES_USER: adsb
          POSTGRES_PASSWORD: adsb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adsb -d adsb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADSB_TEST_DATABASE_URL: postgres://adsb:adsb@localhost:5432/adsb?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Read package version
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "adsb") | .version')
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Could not read adsb version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName > releases.json
          if jq -e --arg tag "$TAG" --arg version "$VERSION" 'any(.[]; .tagName == $tag or .tagName == $version)' releases.json >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping image publication and release creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image name
        if: steps.existing.outputs.exists != 'true'
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.existing.outputs.exists != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.exists != 'true'

      - name: Build and push image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "ADS-B $TAG" --generate-notes
