name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --lib

  integration-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: adsb
          POSTGRES_USER: adsb
          POSTGRES_PASSWORD: adsb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adsb -d adsb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADSB_TEST_DATABASE_URL: postgres://adsb:adsb@localhost:5432/adsb?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test flight_api_integration -- --nocapture
